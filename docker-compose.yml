services:
    postgres:
        image: postgres:18.6-alpine3.24
        container_name: postgres
        restart: no
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 5432 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        environment:
            - POSTGRES_PASSWORD=pass
        networks:
            - internet
        ports:
            - 65432:5432
        volumes:
            - pgdata:/var/lib/postgresql
    
    employee:
        image: employee:v01
        container_name: employee  
        restart: no
        environment:
            - POSTGRES_PASSWORD=pass
        networks:
            - internet
        ports:
            - 9000:9000
        depends_on:
            postgres:
                condition: service_healthy

networks:
    internet:
        driver: bridge
        name: internet

volumes:
    pgdata:
        name: "pgdata"
    